modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/MacatMovie/FastMove-Forge-NeoForge-Port/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Adds animated parkour movement with configurable sliding, dive rolls, wall-running, movement balancing, and first-person camera effects.
Forge 1.20.1 backport with additional enhancements by MacatMovie.
'''
logoFile="assets/fastmove/icon.png"
authors="BeeeBea, port by MacatMovie"
displayURL="https://www.curseforge.com/minecraft/mc-mods/fastmove-enhanced-parkour-movement"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="playeranimator"
mandatory=true
versionRange="[1.0.2-rc1+1.20,)"
ordering="AFTER"
side="CLIENT"

[[mixins]]
config="fastmove.mixins.json"
