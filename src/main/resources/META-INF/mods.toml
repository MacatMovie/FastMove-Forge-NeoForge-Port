modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/BeeeBea/FastMove/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Adds animated parkour movement: dive rolls, wall runs, sliding, and prone movement.
Forge 1.20.1 backport based on the FastMove NeoForge 1.21.1 port, with the old pre-1.0.8 air-slide boost behavior intentionally restored.
'''
logoFile="assets/fastmove/icon.png"
authors="BeeeBea, Forge backport by Pathmakers Studio"
displayURL="https://modrinth.com/mod/fastmove"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="playeranimator"
mandatory=true
versionRange="[1.0.2-rc1+1.20,)"
ordering="AFTER"
side="CLIENT"

[[mixins]]
config="fastmove.mixins.json"
