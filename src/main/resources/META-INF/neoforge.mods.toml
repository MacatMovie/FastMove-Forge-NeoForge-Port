modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/MacatMovie/FastMove-Forge-NeoForge-Port/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Adds animated parkour movement: dive rolls, wall runs, sliding, and crawling.
NeoForge 1.21.1 port based on FastMove 1.0.8, with additional enhancements by MacatMovie.
'''
logoFile="assets/fastmove/icon.png"
authors="BeeeBea, port by MacatMovie"
displayURL="https://www.curseforge.com/minecraft/mc-mods/fastmove-enhanced-parkour-movement"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="playeranimator"
type="required"
versionRange="[2.0.0,)"
ordering="AFTER"
side="CLIENT"

[[mixins]]
config="fastmove.mixins.json"
