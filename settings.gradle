pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}
dependencyResolutionManagement {
    // NeoForge ModDevGradle adds Minecraft/Mojang repositories from the project plugin.
    // Do not use FAIL_ON_PROJECT_REPOS here, or Gradle will fail while applying net.neoforged.moddev.
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.kosmx.dev/' }
    }
}
rootProject.name = 'FastMove-NeoForge-1.21.1'
